<!DOCTYPE html>
<html>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.src = 'assets/images/item_giant_potion.png';
    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      
      // Flood fill or edge-based removal would be better, but user said:
      // "RGB가 235 이상인 배경 픽셀을 alpha 0으로 처리"
      // "이미지 가장자리와 연결된 흰색 또는 거의 흰색 배경 제거"
      
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i+1];
        const b = data[i+2];
        if (r >= 235 && g >= 235 && b >= 235) {
          data[i+3] = 0;
        }
      }
      ctx.putImageData(imageData, 0, 0);
      const link = document.createElement('a');
      link.download = 'item_giant_potion.png';
      link.href = canvas.toDataURL();
      link.click();
    };
  </script>
</body>
</html>
